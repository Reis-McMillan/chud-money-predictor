# MI300X profile for `chudp finetune`. Flags override these values.
[finetune]
context = 1024
covariates = "full"
start = "2025-12-15"       # contract era with a published strike
# Chronological split over the usable span; set val_start / test_start (YYYY-MM-DD) to pin the dates.
val_frac = 0.15
test_frac = 0.15
embargo_bars = 1440        # one day between the last target of a split and the next split

trainable = "all"          # all | head | last:N  (try last:4 first: ~26k contracts is not much data)
precision = "fp32"         # bf16 is ~2x faster, but inference (and evaluation) run in fp32
loss_scale = "none"        # pinball in price space (dollars)
lr = 1e-5
warmup_steps = 100
max_steps = 20000
batch_size = 32
# Memory scales with tokens per pass = micro_batch * variates * (context / 32 + 2). On ROCm 7.2 /
# torch 2.14 the fp32 backward pass segfaulted somewhere above ~12.5k tokens (96 univariate samples at
# context 4096). With 25 variates at context 1024 a sample is 850 tokens, so keep micro_batch <= 8
# (<= 4 at context 2048) and raise batch_size, not this, for a larger effective batch.
micro_batch = 8

eval_every = 200
eval_samples = 8192
patience = 5
device = "auto"
