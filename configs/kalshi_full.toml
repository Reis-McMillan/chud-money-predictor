# MI300X profile: all downloaded history, every minute of every window.
[spec]
freq = "1m"
context = 4096
target = "mean"
strike_mode = "open_tick"
minutes = "0-14"

[run]
window_chunk = 256
batch_size = 128
device = "auto"
bootstrap_days = 1000
plot = true
trajectories = 20
verify_settlement = false

[trading]
price = [0.4, 0.5, 0.6]
tau = [0.52, 0.55, 0.60, 0.65]
